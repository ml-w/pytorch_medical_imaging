[General]
use_cuda        = True
run_mode        = train
run_type	= Classification
plot_tb         = True

[Checkpoint]
cp_save_dir     = ./Backup/C02_3Folds_AttentionResidual.pt
cp_load_dir     = ./Backup/C02_3Folds_AttentionResidual.pt


[Network]
network_type    = AttentionResidual
data_type       = imgclassification


[RunParams]
batch_size      = 4
initial_weight  = 1
learning_rate   = 5E-4
momentum        = 0.9
num_of_epochs   = 3000
decay_rate_LR   = 0.01

[Data]
target_dir          = /dir/to/groud-truth.csv
input_dir           = /dir/to/image.nii.gz
output_dir		    = /dir/to/output/
validation_dir		= /dir/to/validation/image.nii.gz (Can be same as input_dir)
validation_gt_dir	= /dir/to/validation/ground-truth.csv (Can be same as target_dir)

[Filters]
re_suffix           = (.*)
id_list             = ./Configs/CLASS_3Folds/C02.ini
validation_id_list	= ./Configs/CLASS_3Folds/Validation.txt

