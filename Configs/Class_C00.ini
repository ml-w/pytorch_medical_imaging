[General]
use_cuda        = True
run_mode        = train
run_type	= Classification
plot_tb         = True

[Checkpoint]
cp_save_dir     = ./Backup/C00_3Folds_AttentionResidual.pt
cp_load_dir     = ./Backup/C00_3Folds_AttentionResidual.pt


[Network]
network_type    = AttentionResidual
data_type       = imgclassification


[RunParams]
batch_size      = 4
initial_weight  = 1
learning_rate   = 5E-4
momentum        = 0.9
num_of_epochs   = 3000
decay_rate_LR   = 0.01

[Data]
target_dir          = ./NPC_Segmentation/43.Benign_Malignant_Cropped_Larger/Z.DataSheet/Benign_Malignant.csv
input_dir           = ./NPC_Segmentation/44.Benign_Malignant_Cropped_Largest
output_dir		= ./NPC_Segmentation/98.Output/BM/C00
validation_dir		= ./NPC_Segmentation/44.Benign_Malignant_Cropped_Largest
validation_gt_dir	= ./NPC_Segmentation/43.Benign_Malignant_Cropped_Larger/Z.DataSheet/Benign_Malignant.csv

[Filters]
re_suffix           = (.*)
id_list             = ./NPC_Segmentation/99.Testing/CLASS_3Folds/C00.ini
validation_id_list	= ./NPC_Segmentation/99.Testing/CLASS_3Folds/Validation.txt

